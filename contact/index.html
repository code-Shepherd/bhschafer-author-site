			<div id="wrapper">

				<!-- Contact -->
					<main class="blog-shell content-shell" aria-labelledby="contact-title">
						<article id="contact" class="blog-panel content-panel">

								<h2 id="contact-title" class="major">Contact</h2>
								<form action="https://api.web3forms.com/submit" method="POST">

									<input type="hidden" name="access_key" value="60e39894-ea6c-4646-b996-d0d2f03cb120">
									
									<div class="fields">
										<div class="field half">
											<label for="name">Name</label>
											<input type="text" name="name" id="name" autocomplete="name" required />
										</div>
										<div class="field half">
											<label for="email">Email</label>
											<input type="email" name="email" id="email" autocomplete="email" required />
										</div>
										<div class="field">
											<label for="message">Message</label>
											<textarea name="message" id="message" rows="4" required></textarea>
										</div>
									</div>
									<ul class="actions">
										<li><input type="submit" value="Send Message" class="primary" /></li>
										<li><input type="reset" value="Reset" /></li>
									</ul>
								</form>
													</article>
					</main>

				<!-- Footer -->
					<footer id="footer">
						<p class="copyright">
							&copy; <span id="year"></span> | B. H. Schafer | All rights reserved
						</p>

			<script>
				fetch('../particles.json')
					.then(function(response) { return response.json(); })
					.then(function(config) {
						if (config.particles && config.particles.shape && config.particles.shape.image) {
							config.particles.shape.image.src = '../images/rad-rune.webp';
						}
						particlesJS('particles-js', config);
